<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/kynex-icon.svg" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8FAFC" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0A0C" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <script>
    // KYNEX dual-mode bootstrap: resolve the persisted theme BEFORE first
    // paint so dark/light switching is flicker-free (zero FOUC). Mirrors
    // next-themes' storage contract (key "theme", class on <html>). Kept in
    // sync by ThemeProvider; no system listener needed — the provider takes
    // over the moment React mounts.
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var dark =
          stored === "dark" ||
          ((stored === null || stored === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {
        // Storage can throw in private mode — default to light silently.
      }
      try {
        // UI Style Matrix + generational persona: resolve pre-paint so the
        // first frame already carries the chosen design language (zero FOUC,
        // zero layout shift). Mirrors src/lib/uiPrefs.ts — the KYNEX-owned
        // keys use the versioned {v,p} envelope; legacy bare strings are
        // honored; anything invalid resets to the defaults silently. The
        // React provider (UiPrefsProvider) takes over after mount.
        var STYLE_ATTR = "data-ui-style";
        var GEN_ATTR = "data-gen";
        var STYLES = ["glass", "minimal", "neumorph", "clay", "bento"];
        var PERSONAS = ["classic", "millennial", "genz", "alpha"];
        var pick = function (raw, valid, fallback) {
          try {
            var parsed = JSON.parse(raw);
            if (parsed && typeof parsed === "object" && "p" in parsed) parsed = parsed.p;
            return valid.indexOf(parsed) !== -1 ? parsed : fallback;
          } catch (e) {
            return fallback;
          }
        };
        var style = null;
        var gen = null;
        try {
          style = pick(localStorage.getItem("kynex.uiStyle.v1"), STYLES, "glass");
        } catch (e) {}
        try {
          gen = pick(localStorage.getItem("kynex.genPersona.v1"), PERSONAS, "classic");
        } catch (e) {}
        if (style) document.documentElement.setAttribute(STYLE_ATTR, style);
        if (gen) document.documentElement.setAttribute(GEN_ATTR, gen);
      } catch (e) {
        // Attributes are cosmetic — never block boot.
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KYNEX | Your Academic Intelligence OS</title>
  <meta name="description" content="KYNEX builds a living model of your academic journey and continuously determines the highest-impact action you should take next. KNOW, UNDERSTAND, ACT, MASTER, ADVANCE." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
    rel="stylesheet"
  />
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
